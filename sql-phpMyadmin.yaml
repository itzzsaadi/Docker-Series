# Docker Compose configuration for MySQL Database with phpMyAdmin
# This setup provides a complete database management environment

services:
  # MySQL Database Service
  db:
    image: mysql:latest                    # Latest MySQL server image
    environment:
      MYSQL_ROOT_PASSWORD: saad            # Root user password for MySQL
      MYSQL_DATABASE: mydb                 # Creates a default database named 'mydb'
    ports:
      - 3306:3306                          # Expose MySQL on port 3306 (host:container)
    # Optional: Add volume for data persistence
    # volumes:
    #   - mysql_data:/var/lib/mysql

  # phpMyAdmin Web Interface
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest    # Latest phpMyAdmin image
    environment:
      PMA_HOST: db                         # Connect to the 'db' service (MySQL container)
      MYSQL_ROOT_USERNAME: root            # MySQL root username
      MYSQL_ROOT_PASSWORD: saad            # MySQL root password (must match db service)
      MYSQL_ROOT_port: 3306                # MySQL port
    ports:
      - 8080:80                            # Access phpMyAdmin at http://localhost:8080
    depends_on:
      - db                                 # Ensures db service starts before phpMyAdmin

# Optional: Uncomment to enable persistent storage
# volumes:
#   mysql_data:
